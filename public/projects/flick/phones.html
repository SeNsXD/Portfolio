<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flick – phone mockup</title>
<style>
/* Flick phone mockup: 3 phones, screenshots scroll up and down inside the screen.
   Paste the .flick-phones block (+ this CSS) into your site, or use this file as-is / in an <iframe>. */
html,body{margin:0;background:#05070b;color-scheme:dark}
.flick-phones{--w:280px;display:flex;justify-content:center;align-items:center;gap:calc(var(--w)*.14);padding:70px 20px 50px;font-family:sans-serif}
.flick-phones .phone{width:var(--w);padding:calc(var(--w)*.04);border-radius:calc(var(--w)*.17);box-sizing:border-box;
  background:linear-gradient(145deg,#34323d,#14121a);box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1.5px #403d4a inset;flex:none}
.flick-phones .phone.mid{transform:translateY(-26px) scale(1.06)}
.flick-phones .screen{position:relative;aspect-ratio:1080/2340;border-radius:calc(var(--w)*.135);overflow:hidden;background:#0e0b16;isolation:isolate}
.flick-phones .view{position:absolute;left:0;right:0;top:0;overflow:hidden}
.flick-phones .scroll{display:block;width:100%;height:auto;will-change:transform;animation:flick-scroll 14s ease-in-out infinite;animation-delay:var(--d)}
.flick-phones .bar{position:absolute;left:0;width:100%;display:block;z-index:2}
.flick-phones .bar.top{top:0} .flick-phones .bar.bottom{bottom:0}
.flick-phones .cam{position:absolute;z-index:3;top:1.1%;left:50%;width:3.4%;aspect-ratio:1;border-radius:50%;background:#050508;transform:translateX(-50%);box-shadow:0 0 0 2px #15131b}
@keyframes flick-scroll{0%,12%{transform:translateY(0)}48%,62%{transform:translateY(var(--y))}98%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.flick-phones .scroll{animation:none}}
@media (max-width:900px){.flick-phones{--w:min(30vw,240px);gap:3vw}}
</style></head><body>
